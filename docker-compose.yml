version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shega_postgres
    environment:
      POSTGRES_DB: shega
      POSTGRES_USER: shega_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shega_redis
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: shega_navidrome
    environment:
      ND_DATAPATH: /data
      ND_MUSICFOLDER: /music
      ND_LASTFM_ENABLED: "true"
      ND_LASTFM_APIKEY: ${LASTFM_APIKEY}
      ND_LASTFM_SECRET: ${LASTFM_SECRET}
    volumes:
      - ./navidrome-data:/data
      - ./music:/music
    ports:
      - "4533:4533"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shega_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://shega_user:${DB_PASSWORD}@postgres:5432/shega
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: